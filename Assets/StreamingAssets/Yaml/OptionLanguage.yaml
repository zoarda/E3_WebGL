- Id: PackId201
  Label:
     CH: 怎麼回事？幽靈也會累的嗎？
     EN: What's going on? Do ghosts get tired too?
     JP: どういうことだ？幽霊も疲れるのか？

- Id: PackId202
  Label:
     CH: 這應該跟遊戲一樣吧！行動限制的條件我得搞清楚才行！
     EN: This should be just like a game! I need to figure out the conditions that limit my actions!
     JP: ゲームと同じはずだ！行動の制限条件をちゃんと把握しないと！

- Id: PackId203
  Label:
     CH: 大概知道規則了，這次也要繼續色色！
     EN: I think I’ve got the rules down. Time to keep going… and keep things spicy!
     JP: 大体ルールは分かった。今回もエッチなことを続けるぞ！

- Id: PackId204
  Label:
     CH: 繼續！我可不想錯過什麼好康的。
     EN: Keep going! I don’t wanna miss out on any good stuff.
     JP: 続けるぞ！せっかくのチャンス、見逃したくないからな。

- Id: PackId205
  Label:
     CH: 這狀態不知道會持續到什麼時候？好像離不開這個房子。
     EN: How long will this state last? Looks like I can’t leave this house.
     JP: この状態、いつまで続くんだ？どうやらこの家から出られないみたいだな。

- Id: PackId206
  Label:
     CH: 如果這段時光是一個罐頭的話，我希望這一個罐頭不會過期；如果一定要加一個日子的話，我希望是一萬年。
     EN: If this moment were a canned good, I hope it never expires. And if I had to put a date on it... I’d wish for ten thousand years.
     JP: もしこの時間が缶詰だったら、絶対に賞味期限が切れないでほしい。どうしても期限をつけなきゃいけないなら... 一万年がいいな。

